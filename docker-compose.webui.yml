# Serve a MoE-Infinity model through an OpenAI-compatible API and a chat
# WebUI (Open WebUI, https://github.com/open-webui/open-webui -- the same
# chat UI used by the NORTHSTREAM lab, here pointed at MoE-Infinity instead
# of Ollama).
#
# This stack is for interacting with a model, not for running the build/test
# suite -- see docker/Dockerfile + docker/Dockerfile.benchmark for that.
#
# Usage:
#   docker compose -f docker-compose.webui.yml up -d --build
#   open http://localhost:3000
#
# Requires an NVIDIA GPU + the NVIDIA Container Toolkit on the host.
# Override the served model with, e.g.:
#   MOE_MODEL=openai/gpt-oss-20b docker compose -f docker-compose.webui.yml up -d --build
#
# flash-attn is skipped by default (see docker/Dockerfile.serve) to keep the
# build fast and light on RAM/disk -- it's a pure speed optimization with an
# automatic eager-attention fallback. Set INSTALL_FLASH_ATTN=true to include
# it if you need maximum throughput and can afford the extra build time.
#
# model-status (http://localhost:8600) is a read-only page listing locally
# cached models, their size, whether the download is complete, whether
# HuggingFace Hub has a newer commit, and a HW-compatibility check for any
# repo id you look up. It never downloads anything or touches the
# moe-infinity container -- switching models is still done via MOE_MODEL.
#
# MOE_LOG_LEVEL is unset (quiet) by default. Set it in .env when you need to
# trace a slow/stuck load -- e.g. MOE_LOG_LEVEL=debug -- rather than leaving
# verbose logging on all the time. SYS_PTRACE is granted so `py-spy dump
# --pid 1` can be run inside the container for a live stack trace when
# logging alone isn't enough to tell whether it's stuck or just slow.

services:
  moe-infinity:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
      args:
        INSTALL_FLASH_ATTN: ${INSTALL_FLASH_ATTN:-false}
    container_name: moe-infinity-server
    restart: unless-stopped
    environment:
      MOE_MODEL: ${MOE_MODEL:-deepseek-ai/DeepSeek-V2-Lite-Chat}
      MOE_OFFLOAD_DIR: /offload
      MOE_DEVICE_MEMORY_RATIO: ${MOE_DEVICE_MEMORY_RATIO:-0.5}
      MOE_KV_CACHE_RATIO: ${MOE_KV_CACHE_RATIO:-0.15}
      MOE_MAX_BATCH_SIZE: ${MOE_MAX_BATCH_SIZE:-8}
      MOE_API_KEYS: ${MOE_API_KEYS:-}
      HF_TOKEN: ${HF_TOKEN:-}
      MOE_LOG_LEVEL: ${MOE_LOG_LEVEL:-}
    cap_add:
      - SYS_PTRACE
    ports:
      - "8000:8000"
    volumes:
      - moe_offload:/offload
      - moe_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: moe-infinity-open-webui
    restart: unless-stopped
    environment:
      WEBUI_NAME: MoE-Infinity Chat
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://moe-infinity:8000/v1
      OPENAI_API_KEY: ${MOE_API_KEYS:-moe-infinity-local}
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - moe-infinity

  model-status:
    build:
      context: model-status
    container_name: moe-infinity-model-status
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8600:8600"
    volumes:
      - moe_hf_cache:/root/.cache/huggingface:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  moe_offload:
  moe_hf_cache:
  open_webui_data:
